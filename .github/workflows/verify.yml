name: Verify

on:
  push:
    branches: [main, 'release/**', 'releases/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify repository integrity
        run: node tools/verify-repository.mjs
      - name: Protocol smoke tests
        run: node experiments/001/smoke-tests.mjs
      - name: Native packet smoke tests
        run: node experiments/002/native-smoke.mjs
      - name: Design objective smoke tests
        run: node experiments/003/objective-smoke.mjs
      - name: Discovery corpus preflight
        run: node experiments/004/preflight.mjs
