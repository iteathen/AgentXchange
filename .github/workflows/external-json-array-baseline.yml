name: external-json-array-baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "evidence/external/json-array-baseline.mjs"
      - "evidence/external/baselines/json-array-v1.json"
      - ".github/workflows/external-json-array-baseline.yml"
      - "experiments/002/PACKET_*.isg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-json-array-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: RFC 8259 JSON array baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Compare frozen packets to fair JSON-array baseline
        env:
          AX_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node evidence/external/json-array-baseline.mjs agentx-json-array-baseline-result.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agentx-json-array-baseline-result
          path: agentx-json-array-baseline-result.json
          if-no-files-found: error
          retention-days: 30
